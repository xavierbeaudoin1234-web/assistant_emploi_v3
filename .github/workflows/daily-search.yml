name: Actualiser les offres d'emploi
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le lecteur RSS
        run: pip install -r requirements.txt
      - name: Lire les alertes et filtrer les offres
        env:
          JOB_ALERT_FEEDS: ${{ secrets.JOB_ALERT_FEEDS }}
        run: python scripts/update_jobs.py
      - name: Enregistrer la mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Actualiser les offres d'emploi" && git push)
